name: Python CI

on:
  push:
    branches: ["g08", "main"]
  pull_request:
    branches: ["g08", "main"]

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      # Repository klonen
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Python installieren
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Dependencies installieren
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install streamlit pandas pytest mypy

      # Typprüfung
      - name: Run mypy
        run: |
          mypy

      # Tests
      - name: Run pytest
        env:
          PYTHONPATH: src
        run: |
          pytest