[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
files = ["src/bear_honeyworks", "src/app.py"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

[project]
name = "bear-honeyworks"
version = "0.1.0"

[project.scripts]
honeyworks = "app:main"