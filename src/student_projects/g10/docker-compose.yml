version: '3.8'
services:
  scheduler:
    image: daskdev/dask:latest
    command: dask-scheduler
    ports:
      - "8786:8786"
      - "8787:8787"

  worker1:
    image: daskdev/dask:latest
    command: dask-worker tcp://scheduler:8786
    depends_on:
      - scheduler

  worker2:
    image: daskdev/dask:latest
    command: dask-worker tcp://scheduler:8786
    depends_on:
      - scheduler