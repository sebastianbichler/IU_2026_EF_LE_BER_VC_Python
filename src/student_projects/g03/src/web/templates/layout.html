<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RabbitFarm{% endblock %} – Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="app-body">
    <nav class="sidebar">
        <div class="sidebar-header">
            <i class="bi bi-flower2 me-2"></i>
            <span class="sidebar-brand">RabbitFarm</span>
        </div>
        <ul class="sidebar-nav">
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.index' else '' }}" href="{{ url_for('main.index') }}">
                    <i class="bi bi-house-door"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.vegetables' else '' }}" href="{{ url_for('main.vegetables') }}">
                    <i class="bi bi-flower2"></i>
                    <span>Gemüse</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.beds' else '' }}" href="{{ url_for('main.beds') }}">
                    <i class="bi bi-grid-3x3-gap"></i>
                    <span>Beete</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.inventory' else '' }}" href="{{ url_for('main.inventory') }}">
                    <i class="bi bi-box-seam"></i>
                    <span>Lager</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.customers' else '' }}" href="{{ url_for('main.customers') }}">
                    <i class="bi bi-people"></i>
                    <span>Kunden</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.orders' else '' }}" href="{{ url_for('main.orders') }}">
                    <i class="bi bi-cart-check"></i>
                    <span>Bestellungen</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.finances' else '' }}" href="{{ url_for('main.finances') }}">
                    <i class="bi bi-currency-euro"></i>
                    <span>Finanzen</span>
                </a>
            </li>
            <li>
                <a class="sidebar-link {{ 'active' if request.endpoint == 'main.sensors' else '' }}" href="{{ url_for('main.sensors') }}">
                    <i class="bi bi-speedometer2"></i>
                    <span>Sensordaten</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="app-main">
        <div class="app-content">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
